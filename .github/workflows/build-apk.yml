name: Build APK

# Die frühen Entwicklungs-Sessions konnten den Build nicht lokal validieren:
# ihre Sandbox-Egress-Policy blockierte dl.google.com / maven.google.com /
# developers.google.com, wodurch weder AndroidX/Compose noch ML Kit (Translate,
# GenAI Speech Recognition) noch Android-SDK-Komponenten auflösbar waren.
# Dieser Workflow läuft auf einem GitHub-Runner mit vollem Internetzugriff und
# ist damit die verbindliche Build-Verifikation für dieses Projekt - auch
# seit Version 1.2 lokal gebaut werden konnte. Siehe README.md, Abschnitt
# "Build-Verifikation".

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Das ubuntu-latest-Runner-Image bringt das Android-SDK samt Platform 34
      # und Build-Tools 34.0.0 bereits mit (ANDROID_HOME ist gesetzt). Die
      # früher genutzte Action android-actions/setup-android@v3 ist seit
      # Oktober 2026 unbrauchbar: Sie installiert standardmäßig das SDK-Paket
      # "tools", das Google aus dem Repository entfernt hat ("Failed to find
      # package 'tools'") - der Lauf brach damit vor dem ersten Gradle-Aufruf
      # ab. Dieser Schritt stellt die beiden Pakete nur noch sicher (idempotent:
      # sind sie da, passiert nichts).
      - name: Android-Plattform & Build-Tools sicherstellen
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Kein gradlew im Repo eingecheckt: das Wrapper-Binary konnte in der
      # Entwicklungs-Sandbox nicht von services.gradle.org bezogen werden
      # (siehe README). Gradle wird hier stattdessen direkt über
      # gradle/actions/setup-gradle bereitgestellt.
      # Unit-Tests des ÖPNV-Fachwortschatzes (TransitGlossary): der einzige
      # Teil der App, der ohne Gerät und ohne Google-/Vosk-Bibliotheken
      # vollständig prüfbar ist - und der riskanteste, weil eine zu großzügige
      # Schwelle stillschweigend Alltagssprache verfälschen würde.
      - name: Unit-Tests ausführen
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Debug-APK bauen
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vip-live-uebersetzer-debug
          path: app/build/outputs/apk/debug/*.apk
