name: Build APK

# Diese Session konnte den Build nicht lokal validieren: die Sandbox-Egress-
# Policy blockiert dl.google.com / maven.google.com / developers.google.com,
# wodurch weder AndroidX/Compose noch ML Kit (Translate, GenAI Speech
# Recognition) noch Android-SDK-Komponenten auflösbar waren. Dieser Workflow
# läuft auf einem GitHub-Runner mit vollem Internetzugriff und ist damit die
# eigentliche, verbindliche Build-Verifikation für dieses Projekt. Siehe
# README.md, Abschnitt "Build-Verifikation".

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TEMPORÄR: Diese Sandbox kann alphacephei.com nicht erreichen (Egress-
      # Policy blockiert den Host), daher hier verifizieren, welche Vosk-
      # Offline-Modell-URLs für Ukrainisch/Arabisch tatsächlich existieren,
      # bevor sie in VoskSpeechEngine.kt hartkodiert werden. Wird entfernt,
      # sobald das Ergebnis feststeht (siehe README, analog zum früheren
      # ML-Kit-javap-Diagnoseschritt).
      - name: Vosk-Modell-URLs prüfen (Diagnose, wird wieder entfernt)
        run: |
          echo "=== Arabisch ==="
          for url in \
            "https://alphacephei.com/vosk/models/vosk-model-ar-mgb2-0.4.zip" \
            "https://alphacephei.com/vosk/models/vosk-model-ar-0.22-linto.zip" \
            "https://alphacephei.com/vosk/models/vosk-model-small-ar-0.4-linto.zip" \
            "https://alphacephei.com/vosk/models/vosk-model-small-ar-0.3.zip" \
            "https://alphacephei.com/vosk/models/vosk-model-ar-0.4.zip" \
            ; do
            code=$(curl -sI -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "FEHLER")
            len=$(curl -sI --max-time 20 "$url" | grep -i content-length || echo "n/a")
            echo "$code  $url  ($len)"
          done
          echo "=== Ukrainisch ==="
          for url in \
            "https://alphacephei.com/vosk/models/vosk-model-small-uk-v3-small.zip" \
            "https://alphacephei.com/vosk/models/vosk-model-small-uk-v3-nano.zip" \
            "https://alphacephei.com/vosk/models/vosk-model-uk-v3.zip" \
            "https://alphacephei.com/vosk/models/vosk-model-uk-v3-small.zip" \
            "https://alphacephei.com/vosk/models/vosk-model-small-uk-v3.zip" \
            ; do
            code=$(curl -sI -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "FEHLER")
            len=$(curl -sI --max-time 20 "$url" | grep -i content-length || echo "n/a")
            echo "$code  $url  ($len)"
          done
          echo "=== Modell-Katalog-JSON (falls erreichbar) ==="
          curl -sS --max-time 20 "https://alphacephei.com/vosk/models/model-list.json" | head -c 6000 || echo "nicht erreichbar"

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android-Plattform & Build-Tools installieren
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Kein gradlew im Repo eingecheckt: das Wrapper-Binary konnte in der
      # Entwicklungs-Sandbox nicht von services.gradle.org bezogen werden
      # (siehe README). Gradle wird hier stattdessen direkt über
      # gradle/actions/setup-gradle bereitgestellt.
      - name: Debug-APK bauen
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vip-live-uebersetzer-debug
          path: app/build/outputs/apk/debug/*.apk
