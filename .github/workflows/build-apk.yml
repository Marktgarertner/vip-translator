name: Build APK

# Diese Session konnte den Build nicht lokal validieren: die Sandbox-Egress-
# Policy blockiert dl.google.com / maven.google.com / developers.google.com,
# wodurch weder AndroidX/Compose noch ML Kit (Translate, GenAI Speech
# Recognition) noch Android-SDK-Komponenten auflösbar waren. Dieser Workflow
# läuft auf einem GitHub-Runner mit vollem Internetzugriff und ist damit die
# eigentliche, verbindliche Build-Verifikation für dieses Projekt. Siehe
# README.md, Abschnitt "Build-Verifikation".

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android-Plattform & Build-Tools installieren
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Kein gradlew im Repo eingecheckt: das Wrapper-Binary konnte in der
      # Entwicklungs-Sandbox nicht von services.gradle.org bezogen werden
      # (siehe README). Gradle wird hier stattdessen direkt über
      # gradle/actions/setup-gradle bereitgestellt.
      - name: Debug-APK bauen
        run: gradle assembleDebug --stacktrace --no-daemon

      # Diagnose fuer die Alpha-API (com.google.mlkit:genai-speech-recognition):
      # da developers.google.com in der Entwicklungs-Sandbox blockiert war,
      # dient dieser Schritt dazu, die echten Methodensignaturen direkt aus der
      # aufgeloesten AAR zu lesen (javap), statt sie erneut zu erraten. Laeuft
      # unabhaengig vom Erfolg des Builds oben.
      - name: ML-Kit-GenAI-Speech-API introspizieren (Diagnose)
        if: always()
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath -q --no-daemon || true
          mkdir -p /tmp/genai-introspect
          JARS=$(find ~/.gradle/caches -type f \( -iname "genai-speech-recognition*.jar" -o -iname "genai-common*.jar" \) 2>/dev/null)
          echo "Gefundene JARs:"
          echo "$JARS"
          for JAR in $JARS; do
            echo "=== $JAR ==="
            rm -rf /tmp/genai-introspect/extract
            mkdir -p /tmp/genai-introspect/extract
            unzip -oq "$JAR" -d /tmp/genai-introspect/extract
            find /tmp/genai-introspect/extract -iname "*.class" \
              | sed -E 's/\.class$//; s#^/tmp/genai-introspect/extract/##; s#/#.#g' \
              | grep -iE 'speechrecognition|genai\.common' \
              | sort -u \
              | while read -r CLASS; do
                  echo "--- $CLASS ---"
                  javap -p -classpath "$JAR" "$CLASS" || true
                done
          done

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vip-live-uebersetzer-debug
          path: app/build/outputs/apk/debug/*.apk
